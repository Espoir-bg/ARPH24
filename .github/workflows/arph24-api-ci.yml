name: ARPH24 API — CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-api:
    name: Vérification de l'API NestJS
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Installer les dépendances
        run: pnpm install --no-frozen-lockfile

      - name: Générer le client Prisma
        run: pnpm --filter @arph24/api prisma:generate

      - name: Vérifier les types de l'API
        run: pnpm --filter @arph24/api typecheck

      - name: Exécuter les tests de l'API
        run: pnpm --filter @arph24/api test

      - name: Compiler l'API
        run: pnpm --filter @arph24/api build
