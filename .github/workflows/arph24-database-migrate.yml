name: ARPH24 — Migration PostgreSQL

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    name: Appliquer les migrations Prisma
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Installer les dépendances
        run: pnpm install --no-frozen-lockfile

      - name: Vérifier le schéma Prisma
        run: pnpm --filter @arph24/api exec prisma validate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Appliquer les migrations
        run: pnpm --filter @arph24/api prisma:deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
